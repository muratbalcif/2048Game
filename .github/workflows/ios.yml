name: iOS CI
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run native Swift reward smoke tests
        run: |
          swiftc ios/Modern2048/GameEngine.swift ios/Modern2048/RewardedContinue.swift ios/tests/RewardedContinueSmoke.swift -o /tmp/rewarded-smoke
          /tmp/rewarded-smoke
      - name: Run native Swift tile motion tests
        run: |
          swiftc ios/Modern2048/GameEngine.swift ios/Modern2048/TileMotion.swift ios/tests/TileMotionSmoke.swift -o /tmp/tile-motion-smoke
          /tmp/tile-motion-smoke
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile iOS simulator without signing
        working-directory: ios
        run: |
          xcodebuild -project Modern2048.xcodeproj -scheme Modern2048 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
