name: Deploy Global Leaderboard
on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options: [production]
permissions:
  contents: read
concurrency:
  group: leaderboard-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: leaderboard-production
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Missing/invalid D1_DATABASE_ID"; exit 1; }
          test "$D1_DATABASE_ID" != "00000000-0000-0000-0000-000000000000" || exit 1
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Configure D1 binding
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('wrangler.toml')
          p.write_text(p.read_text().replace('00000000-0000-0000-0000-000000000000', os.environ['D1_DATABASE_ID']))
          PY
      - name: Apply D1 migrations
        run: npm run migrate
      - name: Deploy Worker
        run: npm run deploy
      - name: Smoke test
        run: |
          sleep 5
          npx wrangler deployments list --name modern2048-leaderboard
