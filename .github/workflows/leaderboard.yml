name: Leaderboard API CI
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/leaderboard.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/leaderboard.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/modern2048-worker
