name: Modern2048
options:
  bundleIdPrefix: com.modern2048
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    LEADERBOARD_BASE_URL: "https://modern2048-leaderboard.muratbalci269.workers.dev"
targets:
  Modern2048:
    type: application
    platform: iOS
    sources:
      - Modern2048
    info:
      path: Modern2048/Info.plist
      properties:
        GADApplicationIdentifier: "ca-app-pub-9057596586284356~7218954891"
        LeaderboardBaseURL: "$(LEADERBOARD_BASE_URL)"
        UILaunchScreen: {}
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modern2048.game
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Modern2048/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
