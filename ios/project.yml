name: Modern2048
options:
  bundleIdPrefix: com.modern2048
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Modern2048:
    type: application
    platform: iOS
    sources:
      - Modern2048
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modern2048.game
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
